# Course configuration. Adapting the tutor to another course should mean
# writing a new file like this one and pointing at a different corpus —
# no code changes. That is the "adaptable to new courses" deliverable.

course:
  code: EEE4114F
  name: Digital Signal Processing
  institution: University of Cape Town
  level: 4
  convener: Dr Yaaseen Martin

# From the 2026 Course Handout: Part A is classical DSP, Part B is an
# introduction to machine learning. Topic ids tag corpus chunks and benchmark
# items. `patterns` are case-insensitive filename substrings used at ingestion
# to tag single-topic files (lecture slides, mostly); tests, exams and the main
# note sets span topics and are deliberately left untagged.
topics:
  # --- Part A: digital signal processing ---
  - id: dt-signals-systems
    name: Discrete-time signals and systems
  - id: sampling
    name: Sampling, aliasing and reconstruction
  - id: dtft-dft
    name: DTFT, DFT properties and fast algorithms
  - id: ztransform
    name: The z-transform and frequency response from the z-plane
  - id: filter-design
    name: FIR and IIR filter design and structures
    patterns: [lowpass, leakingfilter, movingave]
  - id: spectrum-estimation
    name: Windows and spectrum estimation
    patterns: [spectrumest]
  # --- Part B: machine learning ---
  - id: ml-supervised
    name: Supervised learning, regression and nearest neighbours
    patterns: [knn, linear_regression, supervised_learning, gradient_descent]
  - id: neural-networks
    name: Neural networks, CNNs and training
    patterns: [neural, backprop, forward, foward, fc_network, cnn, padding,
               shared_param, subsampling, training.pdf]
  - id: ml-evaluation
    name: Model evaluation, bias and variance
    patterns: [model_eval, bias_variance]
  - id: reinforcement-learning
    name: Reinforcement learning fundamentals
    patterns: [rl_, "rl ", td learning, policies_value]
  - id: unsupervised-learning
    name: Unsupervised learning (introduction)

# Behavioural policy. These are pedagogical choices and each one needs a
# defence in the report — they are the difference between a tutor and a
# homework-answering machine.
policy:
  # Scaffold toward the answer on assessed work rather than handing it over.
  socratic_on_assessed_work: true
  # Every substantive claim cites a corpus chunk.
  require_citations: true
  # Say "that isn't covered in EEE4114F" rather than answering from general knowledge.
  refuse_out_of_scope: true
  # Notation must match the course's, not a textbook's.
  notation_source: course_notes

retrieval:
  chunk_tokens: 800
  chunk_overlap_tokens: 150
  top_k: 8

model:
  id: claude-opus-5
  # Output cap per answer. Adaptive thinking is on by default on Opus 5 and its
  # thinking tokens count against this, so leave headroom above the visible answer.
  max_tokens: 16000
  # Thinking depth / token spend: low | medium | high | xhigh | max.
  # This is the cost lever — it is what C3-money varies.
  effort: high
